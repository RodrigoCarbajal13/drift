# InEKF estimator settings -- Booster T1 (simulation only).
# Structure and values follow config/mini_cheetah/inekf_estimator.yaml;
# logger paths are left relative since there's no fixed deployment machine
# yet for the T1.
logger:
  # Off for now -- the sim replay harness (examples/t1_sim_replay.cpp) writes
  # its own estimated-vs-ground-truth CSV; DRIFT's own pose logger thread
  # crashed (std::out_of_range in a background thread) the one time this was
  # left on here, not yet root-caused. Revisit before relying on it.
  enable_pose_logger: false
  pose_log_file: "log/t1_pose.txt"
  vel_log_file: "log/t1_vel.txt"
  pose_log_rate: 1000 # Hz

state:
  rotation_std_value: 0.1
  velocity_std_value: 0.1
  position_std_value: 0.1
